name: Apply requested site updates

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-user-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply site enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const enhancedSiteHtml = siteHtml.replace('<head>', `<head>${timerGuard}`).replace('</body>', `${countdownOverride}</body>`);"
          new = "const enhancedSiteHtml = siteHtml.replace(/\\+70/g, '+20').replace('<head>', `<head>${timerGuard}`).replace('</body>', `${countdownOverride}<script src=\"/site-enhancements.js\"></script></body>`);"
          if 'site-enhancements.js' not in s:
              if old not in s:
                  raise SystemExit('Route anchor not found')
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx public/site-enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: ativar feedbacks animados, wrapper transparente e +20'
          git push
