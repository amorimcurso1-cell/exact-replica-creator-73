name: Apply requested site updates

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/feedbacks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Download feedback images and patch site
        env:
          FEEDBACK_PAGES: >-
            https://ibb.co/GfqqCBcY|
            https://ibb.co/LdV1Fzgw|
            https://ibb.co/BRF4MxC|
            https://ibb.co/35dM0gHQ|
            https://ibb.co/HfHCY5F2
        run: |
          python <<'PY'
          from pathlib import Path
          import html
          import json
          import re
          import requests

          repo = Path('.')
          public = repo / 'public' / 'feedbacks'
          public.mkdir(parents=True, exist_ok=True)
          pages = [x.strip() for x in '''${FEEDBACK_PAGES}'''.split('|') if x.strip()]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          }
          saved = []
          session = requests.Session()
          session.headers.update(headers)

          def extract_direct(page_url: str) -> str | None:
              r = session.get(page_url, timeout=25, allow_redirects=True)
              r.raise_for_status()
              text = r.text
              patterns = [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                  r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)',
              ]
              for p in patterns:
                  m = re.search(p, text, re.I)
                  if m:
                      return html.unescape(m.group(1))
              return None

          for i, page in enumerate(pages, 1):
              direct = extract_direct(page)
              if not direct:
                  raise SystemExit(f'Nao foi possivel obter a imagem direta do ImgBB: {page}')
              img = session.get(direct, timeout=40)
              img.raise_for_status()
              ctype = (img.headers.get('content-type') or '').split(';')[0].lower()
              ext = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/gif': '.gif' }.get(ctype)
              if not ext:
                  path_ext = Path(re.sub(r'[?#].*$', '', direct)).suffix.lower()
                  ext = path_ext if path_ext in {'.jpg','.jpeg','.png','.webp','.gif'} else '.jpg'
              target = public / f'feedback-{i}{ext}'
              target.write_bytes(img.content)
              saved.append('/feedbacks/' + target.name)
              print(f'Saved {page} -> {target}')

          ts = repo / 'src' / 'routes' / 'index.tsx'
          text = ts.read_text(encoding='utf-8')
          marker = 'NEXTGEN_USER_UPDATES_V2'
          if marker not in text:
              assets_json = json.dumps(saved, ensure_ascii=False)
              page_html = f'''<style id="nextgen-user-updates">
          /* {marker}: feedback device wrapper, carousel, reveal animations and responsive polish */
          .nextgen-feedback-shell{{width:min(100%,430px);margin:18px auto 28px;padding:4px 0;position:relative;z-index:5}}
          .nextgen-feedback-viewport{{width:100%;overflow:hidden;border-radius:30px;position:relative;padding:10px 0;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%)}}
          .nextgen-feedback-track{{display:flex;width:max-content;gap:18px;align-items:stretch;animation:nextgenFeedbackScroll 42s linear infinite;will-change:transform}}
          .nextgen-feedback-card{{flex:0 0 auto;width:min(78vw,340px);display:flex;justify-content:center;align-items:center;padding:12px;border:1px solid rgba(249,79,23,.35);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.12));box-shadow:0 20px 48px rgba(0,0,0,.45),0 0 28px rgba(249,79,23,.08);position:relative}}
          .nextgen-device-frame{{position:relative;width:100%;padding:10px;border-radius:25px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(249,79,23,.12);overflow:hidden}}
          .nextgen-device-frame::before{{content:"";position:absolute;z-index:3;top:0;left:50%;transform:translateX(-50%);width:34%;height:17px;border-radius:0 0 12px 12px;background:#090909;border:1px solid rgba(255,255,255,.08);border-top:0}}
          .nextgen-device-frame::after{{content:"";position:absolute;right:-2px;top:22%;width:3px;height:54px;border-radius:4px;background:#ff5b28;box-shadow:0 82px 0 #ff5b28}}
          .nextgen-device-frame img{{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:17px;background:transparent;image-rendering:auto}}
          .nextgen-feedback-dots{{display:flex;justify-content:center;gap:7px;margin-top:10px}}
          .nextgen-feedback-dot{{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.28)}}
          .nextgen-feedback-dot:first-child{{background:#f94f17;box-shadow:0 0 10px rgba(249,79,23,.55)}}
          .nextgen-feedback-shell:hover .nextgen-feedback-track{{animation-play-state:paused}}
          @keyframes nextgenFeedbackScroll{{0%{{transform:translate3d(0,0,0)}}100%{{transform:translate3d(-50%,0,0)}}}}
          .ng-reveal{{opacity:0;transform:translate3d(0,28px,0);transition:opacity .75s cubic-bezier(.22,.61,.36,1),transform .75s cubic-bezier(.22,.61,.36,1);will-change:opacity,transform}}
          .ng-reveal.ng-in{{opacity:1 !important;transform:none !important}}
          .nextgen-para-quem-e-image{{display:block;width:min(100%,360px);margin:0 auto 16px;border-radius:24px;overflow:hidden;background:transparent;box-shadow:0 16px 38px rgba(0,0,0,.35)}}
          .nextgen-para-quem-e-image img{{display:block;width:100%;height:auto;background:transparent}}
          @media (max-width:767px){{
            .nextgen-feedback-shell{{width:100%;margin:14px auto 22px}}
            .nextgen-feedback-card{{width:78vw}}
            .nextgen-feedback-track{{gap:14px;animation-duration:36s}}
            .nextgen-device-frame img{{max-height:66vh}}
          }}
          @media (prefers-reduced-motion:reduce){{
            .nextgen-feedback-track{{animation:none !important}}
            .ng-reveal{{opacity:1 !important;transform:none !important;transition:none !important}}
          }}
          </style><script>
          (function(){{
            const feedbackImages={assets_json};
            function textMatch(el,value){{ return el && (el.textContent||'').trim().toUpperCase()===value; }}
            function findFeedbackAnchor(){{
              const all=[...document.querySelectorAll('body *')];
              const matches=all.filter(el=>textMatch(el,'FEEDBACKS') && el.children.length===0);
              return matches[0] || all.find(el=>textMatch(el,'FEEDBACKS')) || null;
            }}
            function buildFeedbackCarousel(){{
              if(document.querySelector('.nextgen-feedback-shell')) return;
              document.querySelectorAll('img').forEach(img=>{{
                const a=(img.getAttribute('alt')||'').toLowerCase();
                const s=(img.getAttribute('src')||'').toLowerCase();
                if(a.includes('feedback') || s.includes('feedback')){{
                  const widget=img.closest('.elementor-element');
                  if(widget) widget.style.setProperty('display','none','important');
                }}
              }});
              const anchor=findFeedbackAnchor();
              if(!anchor) return;
              const host=anchor.closest('.elementor-element') || anchor.parentElement;
              if(!host) return;
              const shell=document.createElement('section');
              shell.className='nextgen-feedback-shell';
              shell.setAttribute('aria-label','Feedbacks de alunos');
              const viewport=document.createElement('div');
              viewport.className='nextgen-feedback-viewport';
              const track=document.createElement('div');
              track.className='nextgen-feedback-track';
              const items=[...feedbackImages,...feedbackImages];
              items.forEach((src,index)=>{{
                const card=document.createElement('article');
                card.className='nextgen-feedback-card';
                const frame=document.createElement('div');
                frame.className='nextgen-device-frame';
                const img=document.createElement('img');
                img.src=src; img.alt=`Feedback de aluno ${{(index%feedbackImages.length)+1}} do Projeto dos 100K`;
                img.loading='lazy';
                img.decoding='async';
                frame.appendChild(img); card.appendChild(frame); track.appendChild(card);
              }});
              viewport.appendChild(track); shell.appendChild(viewport);
              const dots=document.createElement('div'); dots.className='nextgen-feedback-dots';
              feedbackImages.forEach(()=>{{ const d=document.createElement('span'); d.className='nextgen-feedback-dot'; dots.appendChild(d); }});
              shell.appendChild(dots);
              host.insertAdjacentElement('afterend',shell);
            }}
            function initReveal(){{
              const targets=[...document.querySelectorAll('.elementor > .elementor-element,.elementor > .e-con,.elementor-section,.e-con')]
                .filter(el=>!el.closest('.nextgen-feedback-shell') && !el.classList.contains('ng-reveal'));
              targets.forEach(el=>el.classList.add('ng-reveal'));
              const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{{ if(entry.isIntersecting){{ entry.target.classList.add('ng-in'); observer.unobserve(entry.target); }} }}),{{threshold:.12,rootMargin:'0px 0px -7% 0px'}});
              targets.forEach(el=>observer.observe(el));
            }}
            function updateSquareNumber(){{
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              const nodes=[]; let n;
              while(n=walker.nextNode()) nodes.push(n);
              nodes.forEach(node=>{{ if(/(^|\s)\+70(?!\d)/.test(node.nodeValue||'')) node.nodeValue=node.nodeValue.replace(/\+70/g,'+20'); }});
            }}
            function polishTypography(){{
              const style=document.createElement('style'); style.id='nextgen-type-polish';
              style.textContent='body,.elementor,.elementor-heading-title,.elementor-button,.elementor-widget-text-editor,.elementor-widget-icon-list,.elementor-widget-counter{{font-family:"Barlow",Arial,sans-serif !important}} .elementor-heading-title{{letter-spacing:-.01em}}';
              if(!document.getElementById('nextgen-type-polish')) document.head.appendChild(style);
            }}
            function init(){{ buildFeedbackCarousel(); initReveal(); updateSquareNumber(); polishTypography(); }}
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
          }})();
          </script>'''

              if not text.endswith('\n'):
                  text += '\n'
              text = text.replace(
                  "const enhancedSiteHtml = siteHtml.replace('<head>', `<head>${timerGuard}`).replace('</body>', `${countdownOverride}</body>`);",
                  "const pageEnhancements = " + json.dumps(page_html, ensure_ascii=False) + ";\n\nconst enhancedSiteHtml = siteHtml.replace(/\\+70/g, '+20').replace('<head>', `<head>${timerGuard}`).replace('</body>', `${countdownOverride}${pageEnhancements}</body>`);",
              )
              if text == ts.read_text(encoding='utf-8'):
                  raise SystemExit('Anchor principal de index.tsx nao encontrado; nenhuma alteracao aplicada.')
              ts.write_text(text, encoding='utf-8')
              print('index.tsx patched')

          # Ensure build-visible assets have a stable manifest for future edits.
          (public / 'manifest.json').write_text(json.dumps(saved, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx public/feedbacks
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: atualizar feedbacks e animacoes do site"
          git push
