name: Fix orange strip angle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diagonal orange strip directly
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* NEXTGEN_ORANGE_STRIP_DIAGONAL_V2 */\n#faixas-secao .nextgen-marquee{\n  width:116% !important;\n  margin-left:-8% !important;\n  transform:rotate(-4deg) !important;\n  transform-origin:center center !important;\n  overflow:hidden !important;\n}\n#faixas-secao .nextgen-marquee-track{\n  width:max-content !important;\n  transform:none !important;\n}\n@media (max-width:700px){\n  #faixas-secao .nextgen-marquee{\n    width:122% !important;\n    margin-left:-11% !important;\n    transform:rotate(-5deg) !important;\n  }\n}\n'''
          import re
          s = re.sub(r'\n/\* NEXTGEN_ORANGE_STRIP_DIAGONAL_V1 \*/.*?(?=\n/\*|\n#|\n@media|\Z)', '', s, flags=re.S)
          s = re.sub(r'\n/\* NEXTGEN_ORANGE_STRIP_DIAGONAL_V2 \*/.*?(?=\n/\*|\n#|\n@media|\Z)', '', s, flags=re.S)
          anchor = '/* Faixa promocional */'
          if anchor in s:
              s = s.replace(anchor, anchor + css, 1)
          else:
              s += css
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "fix: aplicar faixa laranja diagonal diretamente" || exit 0
          git push
